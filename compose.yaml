services:
  init-data:
    build: .
    user: "0:0"
    restart: "no"
    command: ["init-data-dir"]
    volumes:
      - console-data:/data
  console:
    build: .
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CH_CONSOLE_CLUSTERS: ${CH_CONSOLE_CLUSTERS:-}
      CH_CONSOLE_ENCRYPTION_KEY: ${CH_CONSOLE_ENCRYPTION_KEY:-}
      CLICKHOUSE_ALIAS: ${CLICKHOUSE_ALIAS:-default}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://host.docker.internal:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CH_CONSOLE_ADMIN_USER: ${CH_CONSOLE_ADMIN_USER:-admin}
      CH_CONSOLE_ADMIN_PASSWORD: ${CH_CONSOLE_ADMIN_PASSWORD:-}
      CH_CONSOLE_BASE_PATH: ${CH_CONSOLE_BASE_PATH:-}
      CH_CONSOLE_ALERTING_ENABLED: ${CH_CONSOLE_ALERTING_ENABLED:-false}
      CH_CONSOLE_ALERTING_DRIVER: ${CH_CONSOLE_ALERTING_DRIVER:-}
      CH_CONSOLE_ALERTING_DSN: ${CH_CONSOLE_ALERTING_DSN:-}
      CH_CONSOLE_ALERTING_HISTORY_LIMIT: ${CH_CONSOLE_ALERTING_HISTORY_LIMIT:-300}
      CH_CONSOLE_ALERTING_WEBHOOK_TIMEOUT: ${CH_CONSOLE_ALERTING_WEBHOOK_TIMEOUT:-15s}
    volumes:
      - console-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  console-data:
