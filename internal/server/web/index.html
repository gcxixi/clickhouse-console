<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickHouse Console</title><link rel="stylesheet" href="app.css"></head>
<body>
<div id="login" class="login-wrap"><form id="loginForm" class="login-card"><div class="brand"><span class="logo">CH</span><div><h1>ClickHouse Console</h1><p>安全、轻量的数据库工作台</p></div></div><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录控制台</button><p id="loginError" class="error"></p></form></div>
<div id="app" class="app hidden"><aside><div class="brand sidebar-brand"><span class="logo">CH</span><div><strong>Console</strong><small>ClickHouse</small></div></div><nav><button data-view="query" class="active">⌁ <span>SQL 工作台</span></button><button data-view="schema">◇ <span>对象浏览器</span></button><button data-view="users" class="admin-only">♙ <span>用户管理</span></button><button data-view="audit" class="admin-only">≡ <span>审计日志</span></button></nav><div class="sidebar-bottom"><div id="health" class="health"><i></i><span>检测连接…</span></div><div class="profile"><div id="avatar">A</div><div><strong id="username"></strong><small id="role"></small></div><button id="logout" title="退出">↪</button></div></div></aside>
<main><header><div><h2 id="title">SQL 工作台</h2><p id="subtitle">查询并管理 ClickHouse 数据</p></div><div class="badge">结果上限 1,000 行</div></header>
<section id="queryView" class="view"><div class="editor-card"><div class="editor-toolbar"><div class="editor-context"><strong>SQL Editor</strong><label><span class="sr-only">数据库</span><select id="queryDatabase" aria-label="数据库"><option value="">选择数据库</option></select></label><label><span class="sr-only">数据表</span><select id="queryTable" aria-label="数据表" disabled><option value="">选择数据表</option></select></label></div><div class="editor-actions"><button id="format" class="ghost">格式化</button><button id="run" class="run">▶ 运行 <kbd>⌘↵</kbd></button></div></div><div class="editor-input"><textarea id="sql" spellcheck="false" placeholder="输入 SQL，或选择库表生成查询建议">SELECT version() AS version, now() AS server_time</textarea><span id="suggestionHint" class="suggestion-hint hidden"><kbd>Tab</kbd> 确认建议</span></div></div><div id="queryStatus" class="status hidden"></div><div class="result-card"><div class="result-head"><strong>查询结果</strong><span id="resultMeta">等待执行</span></div><div id="result" class="empty">运行 SQL 后，结果将显示在这里</div></div></section>
<section id="schemaView" class="view hidden"><div class="split"><div class="panel"><div class="panel-title"><strong>数据库</strong><button id="refreshSchema" class="icon">↻</button></div><div id="databases" class="list"></div></div><div class="panel grow"><div class="panel-title"><strong id="tablesTitle">数据表</strong></div><div id="tables" class="list table-list"><div class="empty">选择一个数据库</div></div></div></div></section>
<section id="usersView" class="view hidden"><div class="section-actions"><div><h3>控制台用户</h3><p>配置账号权限；ClickHouse 凭据不会暴露给浏览器。</p></div><button id="newUser">＋ 新建用户</button></div><div class="panel"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>创建时间</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section>
<section id="auditView" class="view hidden"><div class="section-actions"><div><h3>审计日志</h3><p>最近 500 条登录、查询和管理操作。</p></div><button id="refreshAudit" class="ghost">↻ 刷新</button></div><div class="panel scroll"><table><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>状态</th><th>耗时</th><th>语句 / 详情</th></tr></thead><tbody id="auditRows"></tbody></table></div></section>
</main></div>
<dialog id="userDialog"><form id="userForm"><div class="dialog-title"><h3>新建用户</h3><button type="button" class="close">×</button></div><label>用户名<input name="username" required maxlength="64"></label><label>密码<input name="password" type="password" required minlength="12"><small>至少 12 个字符</small></label><label>角色<select name="role"><option value="viewer">Viewer — 只读查询</option><option value="editor">Editor — 查询和 DML</option><option value="admin">Admin — 完整权限</option></select></label><p class="error" id="userError"></p><div class="dialog-actions"><button type="button" class="ghost close">取消</button><button type="submit">创建</button></div></form></dialog>
<div id="toast"></div><script src="app.js"></script></body></html>
