<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickHouse Console</title><link rel="stylesheet" href="app.css"></head>
<body>
<div id="login" class="login-wrap"><form id="loginForm" class="login-card"><div class="brand"><span class="logo">CH</span><div><h1>ClickHouse Console</h1><p>安全、轻量的数据库工作台</p></div></div><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录控制台</button><p id="loginError" class="error"></p></form></div>
<div id="app" class="app hidden"><aside><div class="brand sidebar-brand"><span class="logo">CH</span><div><strong>Console</strong><small>ClickHouse</small></div></div><nav><button data-view="query" class="active"><span class="nav-icon" data-lucide="square-terminal"></span><span class="nav-label">SQL 工作台</span></button><button data-view="schema"><span class="nav-icon" data-lucide="database"></span><span class="nav-label">对象浏览器</span></button><button data-view="monitor"><span class="nav-icon" data-lucide="activity"></span><span class="nav-label">运行监控</span></button><button data-view="clusters" class="admin-only"><span class="nav-icon" data-lucide="server-cog"></span><span class="nav-label">集群管理</span></button><button data-view="users" class="admin-only"><span class="nav-icon" data-lucide="users"></span><span class="nav-label">用户管理</span></button><button data-view="audit" class="admin-only"><span class="nav-icon" data-lucide="scroll-text"></span><span class="nav-label">审计日志</span></button></nav><div class="sidebar-bottom"><label class="cluster-switcher"><span>当前集群</span><select id="clusterSelect" aria-label="当前集群"></select></label><div id="health" class="health"><i></i><span>检测连接…</span></div><div class="profile"><div id="avatar">A</div><div><strong id="username"></strong><small id="role"></small></div><button id="logout" title="退出" aria-label="退出"><span data-lucide="log-out"></span></button></div></div></aside>
<main class="query-active">
<section id="queryView" class="view"><div class="editor-card"><div class="editor-toolbar"><div class="editor-context"><strong>SQL Editor</strong><label><span class="sr-only">数据库</span><select id="queryDatabase" aria-label="数据库"><option value="">选择数据库</option></select></label><label><span class="sr-only">数据表</span><select id="queryTable" aria-label="数据表" disabled><option value="">选择数据表</option></select></label></div><div class="editor-actions"><button id="format" class="ghost">格式化</button><button id="run" class="run"><span data-lucide="play" data-icon-size="13"></span><span>运行</span><kbd>⌘↵</kbd></button></div></div><div class="editor-input"><textarea id="sql" spellcheck="false" placeholder="输入 SQL，或选择库表生成查询建议">SELECT version() AS version, now() AS server_time</textarea><span id="suggestionHint" class="suggestion-hint hidden"><kbd>Tab</kbd> 确认建议</span></div></div><div id="queryStatus" class="status hidden"></div><div class="result-card"><div class="result-head"><strong>查询结果</strong><span id="resultMeta">等待执行</span></div><div id="resultColumns" class="result-column-controls hidden" aria-label="查询结果显示字段"></div><div id="result" class="empty">运行 SQL 后，结果将显示在这里</div></div></section>
<section id="schemaView" class="view hidden"><div class="split"><div class="panel"><div class="panel-title"><strong class="title-with-icon"><span data-lucide="database"></span>数据库</strong><button id="refreshSchema" class="icon" title="刷新对象列表" aria-label="刷新对象列表"><span data-lucide="refresh-cw"></span></button></div><div id="databases" class="list"></div></div><div class="panel grow"><div class="panel-title"><strong id="tablesTitle" class="title-with-icon"><span data-lucide="table-2"></span>数据表</strong></div><div id="tables" class="list table-list"><div class="empty">选择一个数据库</div></div></div></div></section>
<section id="monitorView" class="view hidden"><div class="section-actions monitor-actions compact-actions"><p id="monitorSource">等待加载监控数据</p><button id="refreshMonitor" class="ghost" title="强制刷新监控数据" aria-label="强制刷新监控数据"><span data-lucide="refresh-cw" data-icon-size="13"></span><span>刷新</span></button></div><div id="monitorError" class="status error hidden"></div><div id="monitorContent" class="monitor-content"><div class="empty monitor-empty">正在加载监控数据…</div></div></section>
<section id="clustersView" class="view management-view hidden"><div class="section-actions compact-actions"><button id="newCluster"><span data-lucide="plus" data-icon-size="13"></span><span>添加集群</span></button></div><div class="panel data-panel"><table><thead><tr><th>别名</th><th>来源</th><th>HTTP 地址</th><th>默认数据库</th><th>凭据</th><th></th></tr></thead><tbody id="clusterRows"></tbody></table></div></section>
<section id="usersView" class="view management-view hidden"><div class="section-actions compact-actions"><button id="newUser"><span data-lucide="plus" data-icon-size="13"></span><span>新建用户</span></button></div><div class="panel data-panel"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>创建时间</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section>
<section id="auditView" class="view management-view hidden"><div class="section-actions compact-actions"><button id="refreshAudit" class="ghost"><span data-lucide="refresh-cw" data-icon-size="13"></span><span>刷新</span></button></div><div class="panel data-panel"><table><thead><tr><th>时间</th><th>用户</th><th>集群</th><th>操作</th><th>状态</th><th>耗时</th><th>语句 / 详情</th></tr></thead><tbody id="auditRows"></tbody></table></div></section>
</main></div>
<dialog id="clusterDialog"><form id="clusterForm"><div class="dialog-title"><h3>确认切换集群</h3><button type="button" class="close-cluster" aria-label="关闭"><span data-lucide="x"></span></button></div><p class="cluster-warning">切换后，查询、DDL、DML、对象浏览器和监控都将指向新集群。</p><div class="cluster-route"><strong id="clusterFrom"></strong><span data-lucide="arrow-right"></span><strong id="clusterTo"></strong></div><p class="muted">请确认目标集群无误，避免在错误环境执行操作。</p><div class="dialog-actions"><button type="button" class="ghost close-cluster">取消</button><button type="submit" class="danger-confirm">确认切换</button></div></form></dialog>
<dialog id="clusterManageDialog"><form id="clusterManageForm"><div class="dialog-title"><h3 id="clusterManageTitle">添加集群</h3><button type="button" class="close-cluster-manage" aria-label="关闭"><span data-lucide="x"></span></button></div><input type="hidden" name="id"><label>唯一别名<input name="alias" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}"></label><label>ClickHouse HTTP 地址<input name="url" type="url" required placeholder="https://clickhouse.example:8443"></label><label>默认数据库<input name="database" value="default" maxlength="256"></label><label id="updateCredentialsLabel" class="check-label hidden"><input id="updateCredentials" type="checkbox" name="updateCredentials"> 更新连接凭据</label><div id="credentialFields"><label>ClickHouse 用户<input name="clusterUser" autocomplete="off" maxlength="256"></label><label>ClickHouse 密码<input name="clusterPassword" type="password" autocomplete="new-password" maxlength="1024"><small>提交前会在浏览器内加密，服务端不会回传该字段。</small></label></div><p class="error" id="clusterManageError"></p><div class="dialog-actions"><button type="button" class="ghost close-cluster-manage">取消</button><button type="submit" id="saveCluster">保存</button></div></form></dialog>
<dialog id="userDialog"><form id="userForm"><div class="dialog-title"><h3>新建用户</h3><button type="button" class="close" aria-label="关闭"><span data-lucide="x"></span></button></div><label>用户名<input name="username" required maxlength="64"></label><label>密码<input name="password" type="password" required minlength="12"><small>至少 12 个字符</small></label><label>角色<select name="role"><option value="viewer">Viewer — 只读查询</option><option value="editor">Editor — 查询和 DML</option><option value="admin">Admin — 完整权限</option></select></label><p class="error" id="userError"></p><div class="dialog-actions"><button type="button" class="ghost close">取消</button><button type="submit">创建</button></div></form></dialog>
<div id="toast"></div><script src="app.js"></script></body></html>
